name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04 # pinned on purpose; bumping the runner image is a deliberate change
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Separate job so its status is visible on its own; whether it is a required
  # check is a branch-protection setting.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      # Extra args pass through to `playwright test`: an HTML report and traces
      # for failed tests, uploaded below.
      - run: pnpm e2e --reporter=list,html --trace=retain-on-failure
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: never
          PW_TEST_HTML_REPORT_OPEN: never
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
