name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04 # pinned on purpose; bumping the runner image is a deliberate change
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also part of `pnpm verify`; its own step so a data finding is visible at a glance.
      - name: Data scan (personal data and environment details)
        run: pnpm data-scan
      - run: pnpm verify
      # The publishable tarballs as they would be published (built entry points, version, files).
      - run: pnpm contract:pack-check
      - run: pnpm upstream-port:pack-check

  # Secrets anywhere in history, on every push and pull request.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: a secret removed later is still leaked
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Required by the action for pull requests (it reads the PR's commits).
          # No GITLEAKS_LICENSE: not needed for a repository on a personal account.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The workflow token is read-only, so the action cannot post PR comments; findings
          # show in the job log and summary instead.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # Separate job so its status is visible on its own; whether it is a required
  # check is a branch-protection setting.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      # Extra args pass through to `playwright test`: an HTML report and traces
      # for failed tests, uploaded below.
      - run: pnpm e2e --reporter=list,html --trace=retain-on-failure
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: never
          PW_TEST_HTML_REPORT_OPEN: never
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
